name: Cut Sentio release tag

on:
  workflow_dispatch:
    inputs:
      official_tag:
        description: "Official ClickHouse clickhouse-go release tag, for example v2.47.0"
        required: true
        type: string
      date_suffix:
        description: "Optional YYYYMMDD suffix. Defaults to the UTC run date."
        required: false
        type: string
      branch:
        description: "Release branch to tag. Defaults to the branch selected for this workflow run."
        required: false
        type: string
      dry_run:
        description: "Validate inputs and print the tag without pushing it."
        required: true
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: cut-sentio-release-${{ inputs.official_tag }}
  cancel-in-progress: false

jobs:
  cut-tag:
    runs-on: ubuntu-latest
    steps:
      - name: Normalize inputs
        id: inputs
        env:
          DATE_SUFFIX: ${{ inputs.date_suffix }}
          OFFICIAL_TAG: ${{ inputs.official_tag }}
          REQUESTED_BRANCH: ${{ inputs.branch }}
        run: |
          set -euo pipefail

          official_tag="${OFFICIAL_TAG}"
          if [[ ! "${official_tag}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::official_tag must look like v2.47.0"
            exit 1
          fi

          release_branch="${REQUESTED_BRANCH}"
          if [[ -z "${release_branch}" ]]; then
            release_branch="${GITHUB_REF_NAME}"
          fi

          expected_branch="features/${official_tag}/sentioxyz"
          if [[ "${release_branch}" != "${expected_branch}" ]]; then
            echo "::error::release branch must be ${expected_branch}; got ${release_branch}"
            exit 1
          fi

          date_suffix="${DATE_SUFFIX}"
          if [[ -z "${date_suffix}" ]]; then
            date_suffix="$(date -u +%Y%m%d)"
          fi
          if [[ ! "${date_suffix}" =~ ^[0-9]{8}$ ]]; then
            echo "::error::date_suffix must use YYYYMMDD format"
            exit 1
          fi

          sentio_tag="${official_tag}-sentioxyz-${date_suffix}"

          {
            echo "official_tag=${official_tag}"
            echo "release_branch=${release_branch}"
            echo "sentio_tag=${sentio_tag}"
          } >> "${GITHUB_OUTPUT}"

      - name: Checkout release branch
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ steps.inputs.outputs.release_branch }}

      - name: Validate release tag
        id: validate
        env:
          OFFICIAL_TAG: ${{ steps.inputs.outputs.official_tag }}
          SENTIO_TAG: ${{ steps.inputs.outputs.sentio_tag }}
        run: |
          set -euo pipefail

          git remote add official https://github.com/ClickHouse/clickhouse-go.git
          git fetch --no-tags official "refs/tags/${OFFICIAL_TAG}:refs/tags/${OFFICIAL_TAG}"

          if ! git merge-base --is-ancestor "${OFFICIAL_TAG}" HEAD; then
            echo "::error::${OFFICIAL_TAG} is not an ancestor of HEAD"
            exit 1
          fi

          patch_count="$(git rev-list --count "${OFFICIAL_TAG}..HEAD")"
          if [[ "${patch_count}" -eq 0 ]]; then
            echo "::error::HEAD has no Sentio commits on top of ${OFFICIAL_TAG}"
            exit 1
          fi

          if git rev-parse -q --verify "refs/tags/${SENTIO_TAG}" >/dev/null; then
            echo "::error::local tag ${SENTIO_TAG} already exists"
            exit 1
          fi

          if git ls-remote --exit-code --tags origin "refs/tags/${SENTIO_TAG}" >/dev/null 2>&1; then
            echo "::error::remote tag ${SENTIO_TAG} already exists"
            exit 1
          fi

          head_sha="$(git rev-parse HEAD)"
          official_sha="$(git rev-list -n 1 "${OFFICIAL_TAG}")"

          {
            echo "head_sha=${head_sha}"
            echo "official_sha=${official_sha}"
            echo "patch_count=${patch_count}"
          } >> "${GITHUB_OUTPUT}"

      - name: Create and push tag
        if: ${{ !inputs.dry_run }}
        env:
          OFFICIAL_TAG: ${{ steps.inputs.outputs.official_tag }}
          SENTIO_TAG: ${{ steps.inputs.outputs.sentio_tag }}
        run: |
          set -euo pipefail

          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git tag -a "${SENTIO_TAG}" HEAD -m "Sentio clickhouse-go ${SENTIO_TAG} based on ${OFFICIAL_TAG}"
          git push origin "refs/tags/${SENTIO_TAG}"

      - name: Write summary
        if: always()
        env:
          DRY_RUN: ${{ inputs.dry_run }}
          HEAD_SHA: ${{ steps.validate.outputs.head_sha }}
          OFFICIAL_SHA: ${{ steps.validate.outputs.official_sha }}
          OFFICIAL_TAG: ${{ steps.inputs.outputs.official_tag }}
          PATCH_COUNT: ${{ steps.validate.outputs.patch_count }}
          RELEASE_BRANCH: ${{ steps.inputs.outputs.release_branch }}
          SENTIO_TAG: ${{ steps.inputs.outputs.sentio_tag }}
        run: |
          set -euo pipefail

          {
            echo "### Sentio release tag"
            echo
            echo "- Official tag: \`${OFFICIAL_TAG}\`"
            echo "- Official SHA: \`${OFFICIAL_SHA:-not validated}\`"
            echo "- Release branch: \`${RELEASE_BRANCH}\`"
            echo "- Release HEAD: \`${HEAD_SHA:-not validated}\`"
            echo "- Sentio tag: \`${SENTIO_TAG}\`"
            echo "- Commits on top: \`${PATCH_COUNT:-not validated}\`"
            echo "- Dry run: \`${DRY_RUN}\`"
          } >> "${GITHUB_STEP_SUMMARY}"
